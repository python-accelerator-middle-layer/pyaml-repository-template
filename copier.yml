_subdirectory: template

package_name:
  type: str
  help: >-
    Package name, for example pyaml-cs-oa

distribution_name:
  type: str
  help: >-
    PyPI package name used when installing the project,
    for example accelerator-middle-layer
  default: "{{ package_name }}"

import_name:
  type: str
  help: >-
    Python package name used in import statements.
    Use underscores instead of hyphens, for example pyaml_cs_oa
  default: "{{ package_name | replace('-', '_') }}"

html_title:
  type: str
  help: >-
    Title displayed in the HTML documentation,
    for example Python Accelerator Middle Layer
  default: "{{ package_name }}"

use_docs_extra:
  type: bool
  help: >-
    Install additional dependencies required to build the documentation.
    These must be listed in the docs-extra optional dependency group
    in pyproject.toml.
    This does not include Sphinx dependencies. They are provided separately
    by the template in docs/requirements.txt.
  default: false

repository_url:
  type: str
  help: URL of the GitHub repository
  default: "https://github.com/python-accelerator-middle-layer/{{ package_name }}"